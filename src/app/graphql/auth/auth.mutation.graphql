mutation Login($input: LoginInput!) {
  login(input: $input) {
    id
    name
    email
    role
  }
}

mutation Logout {
  logout
}

query Me {
  me {
    id
    name
    email
    role
  }
}

mutation Signup($input: SignupInput!) {
  signup(input: $input) {
    id
    name
    email
    role
  }
}
