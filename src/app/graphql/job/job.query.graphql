query SearchJobs($input: SearchJobsInput!) {
  searchJobs(input: $input) {
    data {
      id
      title
      description
      location
      salary
      type
      remote
      isApplied
      createdAt
      company {
        id
        name
      }
    }
    meta {
      hasMore
      nextCursor
    }
  }
}
