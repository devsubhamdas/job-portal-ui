query OwnedJobs {
  ownedJobs {
    id
    title
    description
    location
    salary
    type
    remote
    createdAt
    company {
      id
      name
    }
  }
}

query AppliedJobs {
  appliedJobs {
    id
    title
    description
    location
    salary
    type
    remote
    createdAt
    company {
      id
      name
    }
  }
}
