fragment Company on Company {
  id
  name
}

fragment Job on Job {
  id
  title
  description
  location
  salary
  type
  remote
  createdAt
}

query OwnedJobs {
  ownedJobs {
    ...Job
    company {
      ...Company
    }
  }
}

query AppliedJobs {
  appliedJobs {
    ...Job
    company {
      ...Company
    }
  }
}
