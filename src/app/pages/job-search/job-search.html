<!-- layout  -->
<div class="my-16 mx-auto max-w-3xl grid gap-8">
  <!-- search section  -->
  <div>
    <p-icon-field>
      <p-inputicon [class]="searchResultsLoading() ? 'pi pi-spinner pi-spin' : 'pi pi-search'" />
      <input
        pInputText
        type="text"
        id="job-query"
        placeholder="Search jobs..."
        [formControl]="searchControl"
        autocomplete="off"
        fluid
      />
    </p-icon-field>
  </div>

  <!-- search results section -->

  <div class="grid gap-3.5">
    @for (job of searchResults(); track job.id) {
      <app-job-card
        [data]="job"
        [btnOption]="{
          ...btnOption,
          label: job.isApplied ? 'Applied' : 'Apply',
          disabled: !!job.isApplied,
        }"
        (onBtnAction)="onApplyClick(job.id)"
      ></app-job-card>
    }
  </div>

  @if (showNotFoundCard() && !searchResultsLoading()) {
    <div>
      <app-not-found-card content="No Jobs found."></app-not-found-card>
    </div>
  }

  @if (loadingMore()) {
    <div class="flex items-center justify-center my-5">
      <i class="pi pi-spin pi-spinner text-slate-300 text-3xl"></i>
    </div>
  }
  <div #loadMoreTrigger></div>
</div>
